<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="description"
        content="Jolly Roger — חדשות, מבצעים, הזמנות והרפתקאות הצוות."
    >

    <meta name="theme-color" content="#000000">

    <title>Jolly Roger</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;600;700&family=Heebo:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&family=Pirata+One&family=Rye&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css?v=20">
</head>

<body>

    <main class="landing">

        <section
            class="hero"
            id="hero"
            aria-label="Jolly Roger"
        >
            <img
                class="hero__composition"
                src="assets/hero-pirate.png"
                alt="הפיראט של Jolly Roger על רקע חיפה"
                fetchpriority="high"
                decoding="sync"
            >
        </section>


        <section class="benefits">

            <div class="benefits__heading">

                <span
                    class="benefits__ornament benefits__ornament--left"
                    aria-hidden="true"
                ></span>

                <h2 class="section-title">
                    למה אנחנו?
                </h2>

                <span
                    class="benefits__ornament benefits__ornament--right"
                    aria-hidden="true"
                ></span>

            </div>


            <div class="benefits__grid">

                <article class="benefit-card">

                    <div class="benefit-card__image-box">
                        <img
                            class="benefit-card__image benefit-card__image--chest"
                            src="assets/chest.png"
                            alt="תיבת אוצר"
                            loading="lazy"
                        >
                    </div>

                    <h3 class="benefit-card__title">
                        מבחר רחב
                    </h3>

                    <p class="benefit-card__text">
                        כל מה שצריך<br>
                        להרפתקאות שלך
                    </p>

                </article>


                <article class="benefit-card">

                    <div class="benefit-card__image-box">
                        <img
                            class="benefit-card__image"
                            src="assets/compass.png"
                            alt="מצפן"
                            loading="lazy"
                        >
                    </div>

                    <h3 class="benefit-card__title">
                        משלוח מהיר
                    </h3>

                    <p class="benefit-card__text">
                        נביא במהירות<br>
                        ובדיסקרטיות.<br>
                        כמו שפיראטים יודעים
                    </p>

                </article>


                <article class="benefit-card">

                    <div class="benefit-card__image-box">
                        <img
                            class="benefit-card__image"
                            src="assets/coin.png"
                            alt="מטבע פיראטים"
                            loading="lazy"
                        >
                    </div>

                    <h3 class="benefit-card__title">
                        מחירים הוגנים
                    </h3>

                    <p class="benefit-card__text">
                        ללא תוספות מחיר<br>
                        וללא תנאים נסתרים.<br>
                        רק עסקה הוגנת
                    </p>

                </article>


                <article class="benefit-card">

                    <div class="benefit-card__image-box">
                        <img
                            class="benefit-card__image benefit-card__image--mask"
                            src="assets/mask.png"
                            alt="מסכת פיראטים"
                            loading="lazy"
                        >
                    </div>

                    <h3 class="benefit-card__title">
                        אנונימיות מלאה
                    </h3>

                    <p class="benefit-card__text">
                        כל ההזמנות<br>
                        אנונימיות
                    </p>

                </article>

            </div>

        </section>


        <section class="socials">

            <div class="social-board">

                <img
                    class="social-board__background"
                    src="assets/wooden-board.png?v=19"
                    alt=""
                    aria-hidden="true"
                >

                <div class="social-board__content">

                    <h2 class="social-board__title">
                        עקבו אחרינו
                    </h2>

                    <div class="social-board__buttons">

                        <a
                            class="social-button social-button--telegram"
                            href="https://t.me/+L4pIi5kDDD4xN2Fk"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="פתיחת ערוץ הטלגרם של Jolly Roger"
                        >
                            <img
                                src="assets/telegram-button.png"
                                alt="טלגרם: חדשות, מבצעים והזמנות"
                            >
                        </a>

                        <a
                            class="social-button social-button--instagram"
                            href="https://www.instagram.com/jroger.haifa.il"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="פתיחת עמוד האינסטגרם של Jolly Roger"
                        >
                            <img
                                src="assets/instagram-button.png"
                                alt="אינסטגרם: חיי הצוות ומאחורי הקלעים"
                            >
                        </a>

                    </div>

                </div>

            </div>

        </section>


        <footer class="footer">

            <div class="footer__heading">

                <span
                    class="footer__ornament footer__ornament--left"
                    aria-hidden="true"
                ></span>

                <p class="footer__text">
                    <span>תחיה בגדול.</span>
                    <span>תישאר אגדה!</span>
                </p>

                <span
                    class="footer__ornament footer__ornament--right"
                    aria-hidden="true"
                ></span>

            </div>

        </footer>

    </main>

    <script src="script.js?v=9"></script>

</body>
</html>
