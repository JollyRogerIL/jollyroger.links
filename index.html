<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="description"
        content="Jolly Roger — новости, акции и приключения команды."
    >

    <meta name="theme-color" content="#070301">

    <title>Jolly Roger</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="landing">

        <!-- Первый экран -->
        <section class="hero" aria-label="Jolly Roger">

            <img
                class="hero__background"
                src="assets/background-haifa.jpg"
                alt=""
                aria-hidden="true"
                fetchpriority="high"
            >

            <div
                class="hero__darkening"
                aria-hidden="true"
            ></div>

            <img
                class="hero__composition"
                src="assets/hero-pirate.png"
                alt="Пират Jolly Roger на фоне Хайфы"
                fetchpriority="high"
            >

        </section>


        <!-- Преимущества -->
        <section class="benefits">

            <div class="content-container">

                <h2 class="section-title reveal">
                    Почему мы?
                </h2>

                <div class="benefits__list">

                    <article class="benefit-card reveal">

                        <div class="benefit-card__image-box">
                            <img
                                class="benefit-card__image"
                                src="assets/chest.png"
                                alt="Сундук"
                                loading="lazy"
                            >
                        </div>

                        <div class="benefit-card__content">

                            <h3 class="benefit-card__title">
                                Широкий выбор
                            </h3>

                            <p class="benefit-card__text">
                                Всё, что нужно для твоих приключений
                            </p>

                        </div>

                    </article>


                    <article class="benefit-card reveal">

                        <div class="benefit-card__image-box">
                            <img
                                class="benefit-card__image"
                                src="assets/compass.png"
                                alt="Компас"
                                loading="lazy"
                            >
                        </div>

                        <div class="benefit-card__content">

                            <h3 class="benefit-card__title">
                                Быстрая доставка
                            </h3>

                            <p class="benefit-card__text">
                                Привезём быстро и незаметно
                            </p>

                        </div>

                    </article>


                    <article class="benefit-card reveal">

                        <div class="benefit-card__image-box">
                            <img
                                class="benefit-card__image"
                                src="assets/coin.png"
                                alt="Пиратская монета"
                                loading="lazy"
                            >
                        </div>

                        <div class="benefit-card__content">

                            <h3 class="benefit-card__title">
                                Честные цены
                            </h3>

                            <p class="benefit-card__text">
                                Без неожиданных наценок и скрытых условий
                            </p>

                        </div>

                    </article>


                    <article class="benefit-card reveal">

                        <div class="benefit-card__image-box">
                            <img
                                class="benefit-card__image"
                                src="assets/mask.png"
                                alt="Пиратская маска"
                                loading="lazy"
                            >
                        </div>

                        <div class="benefit-card__content">

                            <h3 class="benefit-card__title">
                                Анонимно
                            </h3>

                            <p class="benefit-card__text">
                                Все обращения остаются конфиденциальными
                            </p>

                        </div>

                    </article>

                </div>

            </div>

        </section>


        <!-- Социальные сети -->
        <section class="socials">

            <div class="content-container">

                <div class="social-board reveal">

                    <img
                        class="social-board__background"
                        src="assets/wooden-board.png"
                        alt=""
                        aria-hidden="true"
                        loading="lazy"
                    >

                    <div class="social-board__content">

                        <h2 class="social-board__title">
                            Следуй за нами
                        </h2>

                        <div class="social-board__buttons">

                            <a
                                class="social-button"
                                href="#"
                                target="_blank"
                                rel="noopener noreferrer"
                                aria-label="Открыть Telegram"
                            >
                                <img
                                    src="assets/telegram-button.png"
                                    alt="Telegram"
                                    loading="lazy"
                                >
                            </a>

                            <a
                                class="social-button"
                                href="#"
                                target="_blank"
                                rel="noopener noreferrer"
                                aria-label="Открыть Instagram"
                            >
                                <img
                                    src="assets/instagram-button.png"
                                    alt="Instagram"
                                    loading="lazy"
                                >
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- Финальный слоган -->
        <footer class="footer">

            <p class="footer__text">
                Живи ярко.<br>
                Оставайся легендой!
            </p>

        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
