<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="description"
        content="Jolly Roger — новости, акции, заказы и приключения команды."
    >

    <meta name="theme-color" content="#050200">

    <title>Jolly Roger</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Pirata+One&family=Rye&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="landing">

        <!-- Первый экран -->
        <section class="hero" aria-label="Jolly Roger">

            <img
                class="hero__background"
                src="assets/background-haifa.jpg"
                alt=""
                aria-hidden="true"
                fetchpriority="high"
            >

            <div
                class="hero__light"
                aria-hidden="true"
            ></div>

            <img
                class="hero__composition"
                src="assets/hero-pirate.png"
                alt="Пират Jolly Roger на фоне Хайфы"
                fetchpriority="high"
            >

            <div
                class="hero__bottom-shadow"
                aria-hidden="true"
            ></div>

        </section>


        <!-- Почему мы -->
        <section class="benefits">

            <div class="content-container">

                <h2 class="section-title reveal">
                    Почему мы?
                </h2>

                <div class="benefits__list">

                    <article class="benefit-card reveal">

                        <img
                            class="benefit-card__image benefit-card__image--chest"
                            src="assets/chest.png"
                            alt="Сундук"
                            loading="lazy"
                        >

                        <h3 class="benefit-card__title">
                            Широкий выбор
                        </h3>

                        <p class="benefit-card__text">
                            Всё, что нужно<br>
                            для твоих приключений
                        </p>

                    </article>


                    <article class="benefit-card reveal">

                        <img
                            class="benefit-card__image"
                            src="assets/compass.png"
                            alt="Компас"
                            loading="lazy"
                        >

                        <h3 class="benefit-card__title">
                            Быстрая доставка
                        </h3>

                        <p class="benefit-card__text">
                            Привезём быстро<br>
                            и незаметно
                        </p>

                    </article>


                    <article class="benefit-card reveal">

                        <img
                            class="benefit-card__image"
                            src="assets/coin.png"
                            alt="Пиратская монета"
                            loading="lazy"
                        >

                        <h3 class="benefit-card__title">
                            Честные цены
                        </h3>

                        <p class="benefit-card__text">
                            Без наценок и скрытых условий.<br>
                            Только честный обмен
                        </p>

                    </article>


                    <article class="benefit-card reveal">

                        <img
                            class="benefit-card__image benefit-card__image--mask"
                            src="assets/mask.png"
                            alt="Пиратская маска"
                            loading="lazy"
                        >

                        <h3 class="benefit-card__title">
                            Анонимно
                        </h3>

                        <p class="benefit-card__text">
                            Все заказы<br>
                            анонимны
                        </p>

                    </article>

                </div>

            </div>

        </section>


        <!-- Социальные сети -->
        <section class="socials">

            <div class="content-container">

                <div class="social-board reveal">

                    <img
                        class="social-board__background"
                        src="assets/wooden-board.png"
                        alt=""
                        aria-hidden="true"
                        loading="lazy"
                    >

                    <div class="social-board__content">

                        <h2 class="social-board__title">
                            Следуй за нами
                        </h2>

                        <div class="social-board__buttons">

                            <a
                                class="social-button"
                                href="https://t.me/+tiKPZxjzs_xhZWZk"
                                target="_blank"
                                rel="noopener noreferrer"
                                aria-label="Открыть Telegram Jolly Roger"
                            >
                                <img
                                    src="assets/telegram-button.png"
                                    alt="Telegram: новости, акции и заказы"
                                    loading="lazy"
                                >
                            </a>

                            <a
                                class="social-button"
                                href="https://www.instagram.com/jroger.haifa"
                                target="_blank"
                                rel="noopener noreferrer"
                                aria-label="Открыть Instagram Jolly Roger"
                            >
                                <img
                                    src="assets/instagram-button.png"
                                    alt="Instagram: жизнь команды и закулисье"
                                    loading="lazy"
                                >
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- Нижний слоган -->
        <footer class="footer">

            <span class="footer__anchor" aria-hidden="true">
                ⚓
            </span>

            <p class="footer__text">
                Живи ярко.<br>
                Оставайся легендой!
            </p>

            <span class="footer__anchor" aria-hidden="true">
                ⚓
            </span>

        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
