<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="description"
        content="Jolly Roger — новости, акции, заказы и приключения команды."
    >

    <meta name="theme-color" content="#000000">

    <title>Jolly Roger</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Pirata+One&family=Rye&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css?v=9">
</head>

<body>

    <main class="landing">

        <!-- Первый экран -->
        <section
            class="hero"
            id="hero"
            aria-label="Jolly Roger"
        >

            <img
                class="hero__composition"
                src="assets/hero-pirate.png"
                alt="Пират Jolly Roger на фоне Хайфы"
                fetchpriority="high"
                decoding="sync"
            >

        </section>


        <!-- Почему мы -->
        <section class="benefits">

            <div class="benefits__heading">

                <span
                    class="benefits__ornament benefits__ornament--left"
                    aria-hidden="true"
                ></span>

                <h2 class="section-title">
                    Почему мы?
                </h2>

                <span
                    class="benefits__ornament benefits__ornament--right"
                    aria-hidden="true"
                ></span>

            </div>


            <div class="benefits__grid">

                <article class="benefit-card">

                    <div class="benefit-card__image-box">

                        <img
                            class="benefit-card__image benefit-card__image--chest"
                            src="assets/chest.png"
                            alt="Сундук"
                            loading="lazy"
                        >

                    </div>

                    <h3 class="benefit-card__title">
                        Широкий выбор
                    </h3>

                    <p class="benefit-card__text">
                        Всё, что нужно<br>
                        для твоих приключений
                    </p>

                </article>


                <article class="benefit-card">

                    <div class="benefit-card__image-box">

                        <img
                            class="benefit-card__image"
                            src="assets/compass.png"
                            alt="Компас"
                            loading="lazy"
                        >

                    </div>

                    <h3 class="benefit-card__title">
                        Быстрая доставка
                    </h3>

                    <p class="benefit-card__text">
                        Привезём быстро<br>
                        и незаметно.<br>
                        Как и подобает пиратам
                    </p>

                </article>


                <article class="benefit-card">

                    <div class="benefit-card__image-box">

                        <img
                            class="benefit-card__image"
                            src="assets/coin.png"
                            alt="Пиратская монета"
                            loading="lazy"
                        >

                    </div>

                    <h3 class="benefit-card__title">
                        Честные цены
                    </h3>

                    <p class="benefit-card__text">
                        Без наценок и<br>
                        скрытых условий.<br>
                        Только честный обмен
                    </p>

                </article>


                <article class="benefit-card">

                    <div class="benefit-card__image-box">

                        <img
                            class="benefit-card__image benefit-card__image--mask"
                            src="assets/mask.png"
                            alt="Пиратская маска"
                            loading="lazy"
                        >

                    </div>

                    <h3 class="benefit-card__title">
                        Анонимно
                    </h3>

                    <p class="benefit-card__text">
                        Все заказы<br>
                        анонимны
                    </p>

                </article>

            </div>

        </section>


        <!-- Социальные сети -->
        <section class="socials">

            <div class="social-board">

                <img
                    class="social-board__background"
                    src="assets/wooden-board.png"
                    alt=""
                    aria-hidden="true"
                    loading="lazy"
                >

                <div class="social-board__content">

                    <h2 class="social-board__title">
                        Следуй за нами
                    </h2>

                    <div class="social-board__buttons">

                        <a
                            class="social-button social-button--telegram"
                            href="https://t.me/+tiKPZxjzs_xhZWZk"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Открыть Telegram Jolly Roger"
                        >

                            <img
                                src="assets/telegram-button.png"
                                alt="Telegram: новости, акции и заказы"
                                loading="lazy"
                            >

                        </a>

                        <a
                            class="social-button social-button--instagram"
                            href="https://www.instagram.com/jroger.haifa"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Открыть Instagram Jolly Roger"
                        >

                            <img
                                src="assets/instagram-button.png"
                                alt="Instagram: жизнь команды и закулисье"
                                loading="lazy"
                            >

                        </a>

                    </div>

                </div>

            </div>

        </section>


        <!-- Нижний слоган -->
        <footer class="footer">

            <span class="footer__anchor" aria-hidden="true">
                ⚓
            </span>

            <p class="footer__text">
                Живи ярко. Оставайся легендой!
            </p>

            <span class="footer__anchor" aria-hidden="true">
                ⚓
            </span>

        </footer>

    </main>

    <script src="script.js?v=8"></script>

</body>
</html>
